# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: rovensa.soplan
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: HSD
          url: http://hsd:443
          client: '100'
        app:
          name: ZUI5_SD_SO_PLAN
          description: Sales Order Planning
          package: ZSD001
          transport: HSDK973303
        exclude:
          - /test/
